<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Notepad</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; background: #f0f2f5; }
        .sidebar { width: 300px; background: #ffffff; border-right: 1px solid #ccc; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .card { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 15px; }
        .card h3 { margin-top: 0; font-size: 1rem; }
        .workspace { flex: 1; display: flex; flex-direction: column; }
        .toolbar { background: #ffffff; padding: 12px 20px; border-bottom: 1px solid #ccc; display: flex; gap: 10px; align-items: center; }
        button, select, input[type="color"] { padding: 8px 12px; cursor: pointer; border: 1px solid #bbb; border-radius: 6px; background: #fff; }
        .danger { background: #ff4d4d; color: white; border: none; }
        .success { background: #28a745; color: white; border: none; }
        .primary { background: #007bff; color: white; border: none; }
        #editor-container { flex: 1; padding: 20px; box-sizing: border-box; }
        #notepad-text-area { width: 100%; height: 100%; padding: 20px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 10px; resize: none; outline: none; }
        video { width: 100%; background: #000; border-radius: 6px; display: none; margin-bottom: 10px; }
        .preview-box { width: 100%; border-radius: 6px; margin-top: 10px; display: none; }
        audio { width: 100%; margin-top: 10px; display: none; }
        #status-message { font-weight: bold; color: #28a745; margin-left: auto; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="card">
            <h3>📷 Camera</h3>
            <video id="webcam-video" autoplay playsinline></video>
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <button id="btn-cam-start">Turn On Camera</button>
                <button id="btn-cam-snap" class="success" style="display:none;">Take Photo</button>
                <button id="btn-cam-stop" class="danger" style="display:none;">Close Camera</button>
            </div>
            <img id="saved-photo-view" class="preview-box" alt="Captured View">
        </div>

        <div class="card">
            <h3>🎙️ Audio Recorder</h3>
            <button id="btn-audio-record" style="width:100%;">Start Voice Recording</button>
            <audio id="audio-playback" controls></audio>
        </div>
    </div>

    <div class="workspace">
        <div class="toolbar">
            <button id="btn-delete-all" class="danger">Delete Everything</button>
            <button id="btn-save-app" class="success">💾 Save Inside App</button>
            <span id="status-message"></span>
            
            <div style="border-left:1px solid #ccc; height:20px; margin:0 10px;"></div>

            <button id="btn-bold" style="font-weight:bold;">B</button>
            <button id="btn-italic" style="font-style:italic;">I</button>
            <button id="btn-underline" style="text-decoration:underline;">U</button>

            <span style="margin-left:15px;">Color:</span>
            <input type="color" id="colorPicker" value="#000000">

            <span>Size:</span>
            <select id="sizePicker">
                <option value="16px">Normal</option>
                <option value="12px">Small</option>
                <option value="24px">Large</option>
                <option value="32px">Heading</option>
            </select>
        </div>

        <div id="editor-container">
            <textarea id="notepad-text-area" placeholder="Start typing notes..."></textarea>
        </div>
    </div>

    <!-- This links to the external JavaScript file safely -->
    <script src="script.js"></script>
</body>
</html>
